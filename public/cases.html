<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحالات - وصلها بخير</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-hands-helping logo-icon"></i>
                    <span class="logo-text">وصلها بخير</span>
                    <span class="logo-tagline">خيرك يوصل أسرع</span>
                </div>
                <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="القائمة">
                    <i class="fas fa-bars"></i>
                </button>
                <nav class="main-nav" id="main-nav">
                    <a href="index.html" class="nav-link">الرئيسية</a>
                    <a href="cases.html" class="nav-link">الحالات</a>
                    <a href="add_case.html" class="nav-link" style="display: none;">طلب مساعدة</a>
                    <a href="account.html" class="nav-link" style="display: none;">الحساب</a>
                    <span class="user-info" style="display: none;"></span>
                    <a href="logout.html" class="nav-link logout" style="display: none;">تسجيل خروج</a>
                    <a href="login.html" class="nav-link">تسجيل دخول</a>
                    <a href="register.html" class="nav-link">تسجيل جديد</a>
                </nav>
            </div>
        </div>
    </header>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="fas fa-list page-icon"></i>
                    الحالات المفتوحة
                </h1>
                <p class="page-subtitle">تصفح جميع الحالات المتاحة وقدم المساعدة</p>
            </div>
            
            <div id="add-case-button-container" style="display: none; text-align: center; margin-bottom: 2rem;">
                <a href="add_case.html" class="btn btn-accent">
                    <i class="fas fa-plus btn-icon"></i>
                    <span>إضافة حالتي</span>
                </a>
            </div>
            
            <div id="cases-container">
                <div style="text-align: center; padding: 2rem; color: var(--muted);">جاري التحميل...</div>
            </div>
        </div>
    </main>
    <footer class="main-footer">
        <div class="container">
            <p>كل الحقوق محفوظة لجمعية يد الخير &copy; <span id="current-year"></span></p>
        </div>
    </footer>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        
        async function loadCases() {
            const container = document.getElementById('cases-container');
            const pageSubtitle = document.querySelector('.page-subtitle');
            
            try {
                const result = await API.getCases();
                if (result.status === 'ok' && result.cases) {
                    if (pageSubtitle && currentUser) {
                        if (currentUser.role === 'donor') {
                            pageSubtitle.textContent = 'تصفح جميع الحالات المتاحة وقدم المساعدة';
                        } else if (currentUser.role === 'needy') {
                            pageSubtitle.textContent = 'تصفح حالات المستفيدين الأخرى';
                        }
                    }
                    
                    if (result.cases.length === 0) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-inbox empty-icon"></i>
                                <h2 class="empty-title">لا توجد حالات مفتوحة حالياً</h2>
                                <p class="empty-desc">لم يتم إضافة أي حالات بعد. كن أول من يضيف حالة!</p>
                                ${currentUser && currentUser.role === 'needy' ? '<a href="add_case.html" class="btn btn-accent"><i class="fas fa-plus"></i> إضافة حالتي</a>' : '<a href="register.html" class="btn btn-accent"><i class="fas fa-user-plus"></i> سجل الآن</a>'}
                            </div>
                        `;
                    } else {
                        container.innerHTML = `
                            <div class="cases-grid">
                                ${result.cases.map(caseItem => `
                                    <div class="case-card ${caseItem.urgent ? 'urgent' : ''}" id="case-${caseItem.id}">
                                        <div class="case-header">
                                            <div class="case-title">${escapeHtml(caseItem.item_name)}</div>
                                            ${caseItem.urgent ? '<span class="urgent-badge">عاجل</span>' : ''}
                                        </div>
                                        <div class="case-info">
                                            <div class="case-info-row">
                                                <i class="fas fa-user case-info-icon"></i>
                                                <div class="case-info-content">
                                                    <span class="case-info-label">المستفيد :</span>
                                                    <span class="case-info-value">${escapeHtml(caseItem.user_name)}</span>
                                                </div>
                                            </div>
                                            <div class="case-info-row">
                                                <i class="fas fa-hashtag case-info-icon"></i>
                                                <div class="case-info-content">
                                                    <span class="case-info-label">العدد :</span>
                                                    <span class="case-info-value">${escapeHtml(caseItem.quantity)}</span>
                                                </div>
                                            </div>
                                            ${caseItem.type ? `
                                            <div class="case-info-row">
                                                <i class="fas fa-tag case-info-icon"></i>
                                                <div class="case-info-content">
                                                    <span class="case-info-label">النوع :</span>
                                                    <span class="case-info-value">${escapeHtml(caseItem.type)}</span>
                                                </div>
                                            </div>
                                            ` : ''}
                                            <div class="case-info-row">
                                                <i class="fas fa-calendar case-info-icon"></i>
                                                <div class="case-info-content">
                                                    <span class="case-info-label">التاريخ :</span>
                                                    <span class="case-info-value">${formatDate(caseItem.created_at)}</span>
                                                </div>
                                            </div>
                                            ${caseItem.status === 'claimed' ? `
                                            <div class="case-status-badge">
                                                <i class="fas fa-check-circle status-icon"></i>
                                                <span>تم التوفير</span>
                                            </div>
                                            ` : ''}
                                        </div>
                                        ${currentUser && currentUser.role === 'donor' && caseItem.status === 'open' ? `
                                        <div class="case-actions">
                                            <button class="btn btn-accent case-action-btn" id="case-btn-${caseItem.id}" onclick="provideCase(${caseItem.id})">
                                                <i class="fas fa-hand-holding-heart btn-icon"></i>
                                                <span>يمكن التوفير</span>
                                            </button>
                                        </div>
                                        ` : caseItem.status === 'claimed' ? `
                                        <div class="case-actions">
                                            <button class="btn case-action-btn" disabled>
                                                <i class="fas fa-check btn-icon"></i>
                                                <span>تم التوفير</span>
                                            </button>
                                        </div>
                                        ` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }
                } else {
                    container.innerHTML = '<div class="alert alert-error">حدث خطأ أثناء جلب الحالات</div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="alert alert-error">حدث خطأ في الاتصال</div>';
            }
        }
        
        async function provideCase(caseId) {
            if (!confirm('هل أنت متأكد من أنك تستطيع توفير هذه الحالة؟')) {
                return;
            }
            
            try {
                const result = await API.donate(caseId, csrfToken);
                if (result.status === 'ok') {
                    showToast('تم توفير الحالة بنجاح! منطقة التوصيل : ' + result.delivery_place, 'success');
                    const btn = document.querySelector(`#case-btn-${caseId}`);
                    if (btn) {
                        btn.disabled = true;
                        btn.innerHTML = '<i class="fas fa-check btn-icon"></i><span>تم التوفير</span>';
                    }
                    const card = document.querySelector(`#case-${caseId}`);
                    if (card) {
                        card.classList.add('claimed');
                    }
                    await loadCases();
                } else {
                    showToast('حدث خطأ: ' + result.msg, 'error');
                }
            } catch (error) {
                showToast('حدث خطأ في الاتصال', 'error');
            }
        }
        
        document.addEventListener('DOMContentLoaded', async function() {
            await initAuth();
            updateNavigation();
            
            if (currentUser && currentUser.role === 'needy') {
                const addCaseBtnContainer = document.getElementById('add-case-button-container');
                if (addCaseBtnContainer) {
                    addCaseBtnContainer.style.display = 'block';
                }
            }
            
            await loadCases();

            const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
            const mainNav = document.getElementById('main-nav');
            
            if (mobileMenuToggle && mainNav) {
                mobileMenuToggle.addEventListener('click', function() {
                    mainNav.classList.toggle('active');
                    mobileMenuToggle.classList.toggle('active');
                });

                document.addEventListener('click', function(e) {
                    if (!mainNav.contains(e.target) && !mobileMenuToggle.contains(e.target)) {
                        mainNav.classList.remove('active');
                        mobileMenuToggle.classList.remove('active');
                    }
                });
            }
        });
    </script>
</body>
</html>
