<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل حساب جديد - وصلها بخير</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-hands-helping logo-icon"></i>
                    <span class="logo-text">وصلها بخير</span>
                    <span class="logo-tagline">خيرك يوصل أسرع</span>
                </div>
                <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="القائمة">
                    <i class="fas fa-bars"></i>
                </button>
                <nav class="main-nav" id="main-nav">
                    <a href="index.html" class="nav-link">الرئيسية</a>
                    <a href="cases.html" class="nav-link">الحالات</a>
                    <a href="login.html" class="nav-link">تسجيل دخول</a>
                    <a href="register.html" class="nav-link">تسجيل جديد</a>
                </nav>
            </div>
        </div>
    </header>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="fas fa-user-plus page-icon"></i>
                    تسجيل حساب جديد
                </h1>
                <p class="page-subtitle">انضم إلينا وكن جزءاً من الخير</p>
            </div>
            
            <div class="card form-card">
                <h2 class="card-title">
                    <i class="fas fa-user-edit title-icon"></i>
                    إنشاء حساب جديد
                </h2>
                
                <div id="error-message" class="alert alert-error" style="display: none;"></div>
                <div id="success-message" class="alert alert-success" style="display: none;"></div>

                <form id="register-form">
                    <div class="form-group">
                        <label class="form-label" for="name">الاسم *</label>
                        <input type="text" class="form-input" id="name" name="name" required minlength="3">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">البريد الإلكتروني</label>
                        <input type="email" class="form-input" id="email" name="email">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="phone">رقم الجوال</label>
                        <input type="tel" class="form-input" id="phone" name="phone">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="role">الدور *</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="needy">مستفيد</option>
                            <option value="donor">متبرع</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">كلمة المرور *</label>
                        <input type="password" class="form-input" id="password" name="password" required minlength="6">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password_confirm">تأكيد كلمة المرور *</label>
                        <input type="password" class="form-input" id="password_confirm" name="password_confirm" required minlength="6">
                    </div>

                    <button type="submit" class="btn btn-accent" style="width: 100%;">
                        <i class="fas fa-user-plus btn-icon"></i>
                        <span>تسجيل</span>
                    </button>
                </form>

                <p style="text-align: center; margin-top: 1.5rem; color: var(--muted);">
                    لديك حساب بالفعل؟ <a href="login.html" style="color: var(--accent);">تسجيل دخول</a>
                </p>
            </div>
        </div>
    </main>
    <footer class="main-footer">
        <div class="container">
            <p>كل الحقوق محفوظة لجمعية يد الخير &copy; <span id="current-year"></span></p>
        </div>
    </footer>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
        
        document.addEventListener('DOMContentLoaded', async function() {
            const isLoggedIn = await initAuth();
            if (isLoggedIn) {
                window.location.href = 'index.html';
                return;
            }

            const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
            const mainNav = document.getElementById('main-nav');
            
            if (mobileMenuToggle && mainNav) {
                mobileMenuToggle.addEventListener('click', function() {
                    mainNav.classList.toggle('active');
                    mobileMenuToggle.classList.toggle('active');
                });

                document.addEventListener('click', function(e) {
                    if (!mainNav.contains(e.target) && !mobileMenuToggle.contains(e.target)) {
                        mainNav.classList.remove('active');
                        mobileMenuToggle.classList.remove('active');
                    }
                });
            }
            
            document.getElementById('register-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const errorMsg = document.getElementById('error-message');
                const successMsg = document.getElementById('success-message');
                errorMsg.style.display = 'none';
                successMsg.style.display = 'none';
                
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const role = document.getElementById('role').value;
                const password = document.getElementById('password').value;
                const password_confirm = document.getElementById('password_confirm').value;
                
                if (!name || name.length < 3) {
                    errorMsg.textContent = 'الاسم يجب أن يكون 3 أحرف على الأقل';
                    errorMsg.style.display = 'block';
                    return;
                }
                
                if (!email && !phone) {
                    errorMsg.textContent = 'يجب إدخال البريد الإلكتروني أو رقم الجوال';
                    errorMsg.style.display = 'block';
                    return;
                }
                
                if (password !== password_confirm) {
                    errorMsg.textContent = 'كلمات المرور غير متطابقة';
                    errorMsg.style.display = 'block';
                    return;
                }
                
                if (password.length < 6) {
                    errorMsg.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
                    errorMsg.style.display = 'block';
                    return;
                }
                
                try {
                    const result = await API.register({
                        name,
                        email,
                        phone,
                        role,
                        password,
                        password_confirm
                    });
                    
                    if (result.status === 'ok') {
                        successMsg.textContent = result.msg || 'تم التسجيل بنجاح! يمكنك تسجيل الدخول الآن.';
                        successMsg.style.display = 'block';
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 2000);
                    } else {
                        errorMsg.textContent = result.msg || 'حدث خطأ أثناء التسجيل';
                        errorMsg.style.display = 'block';
                    }
                } catch (error) {
                    errorMsg.textContent = 'حدث خطأ في الاتصال';
                    errorMsg.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
